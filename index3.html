<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snake</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #1a1a1a;
            color: #fff;
            font-family: monospace;
        }
        #score {
            font-size: 1.2em;
            margin-bottom: 12px;
        }
        canvas {
            border: 2px solid #444;
            background: #111;
        }
        #message {
            margin-top: 12px;
            font-size: 1em;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <canvas id="game" width="400" height="400"></canvas>
    <div id="message">Press any arrow key to start</div>

    <script>
        const CELL = 20;
        const COLS = 20;
        const ROWS = 20;

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const messageEl = document.getElementById('message');

        let snake, dir, nextDir, food, score, loop, running;

        function init() {
            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
            dir = { x: 1, y: 0 };
            nextDir = { x: 1, y: 0 };
            score = 0;
            running = false;
            scoreEl.textContent = 'Score: 0';
            messageEl.textContent = 'Press any arrow key to start';
            placeFood();
            draw();
        }

        function placeFood() {
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * COLS),
                    y: Math.floor(Math.random() * ROWS)
                };
            } while (snake.some(s => s.x === pos.x && s.y === pos.y));
            food = pos;
        }

        function step() {
            dir = nextDir;
            const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
                snake.some(s => s.x === head.x && s.y === head.y)) {
                clearInterval(loop);
                running = false;
                messageEl.textContent = 'Game over! Press any arrow key to restart';
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreEl.textContent = 'Score: ' + score;
                placeFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Food
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(food.x * CELL + 1, food.y * CELL + 1, CELL - 2, CELL - 2);

            // Snake
            snake.forEach((seg, i) => {
                ctx.fillStyle = i === 0 ? '#2ecc71' : '#27ae60';
                ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
            });
        }

        document.addEventListener('keydown', e => {
            const map = {
                ArrowUp:    { x: 0,  y: -1 },
                ArrowDown:  { x: 0,  y:  1 },
                ArrowLeft:  { x: -1, y:  0 },
                ArrowRight: { x:  1, y:  0 }
            };
            const d = map[e.key];
            if (!d) return;
            e.preventDefault();

            // Prevent reversing
            if (d.x === -dir.x && d.y === -dir.y) return;
            nextDir = d;

            if (!running) {
                if (messageEl.textContent.includes('restart')) init();
                running = true;
                messageEl.textContent = '';
                loop = setInterval(step, 120);
            }
        });

        init();
    </script>
</body>
</html>
