<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, #app-layout {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* ── Outer layout ── */
    #app-layout {
        display: flex;
        min-height: 520px;
        background: #f0f4f8;
    }

    /* ── Main content area ── */
    #main-content {
        flex: 1;
        min-width: 0;
        padding: 28px 32px;
        background: #f0f4f8;
    }

    /* ── Intro overlay ── */
    #intro-overlay {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 60px 24px;
        min-height: 420px;
    }
    #intro-overlay.active { display: flex; }
    #intro-overlay .intro-icon { font-size: 4.5em; margin-bottom: 20px; }
    #intro-overlay h2 {
        font-size: 2em;
        font-weight: 700;
        color: #1a365d;
        margin-bottom: 14px;
    }
    #intro-overlay .intro-sub {
        font-size: 1.05em;
        color: #4a5568;
        line-height: 1.7;
        max-width: 420px;
        margin-bottom: 40px;
    }
    #intro-overlay button {
        padding: 14px 40px;
        background: #2b6cb0;
        color: #fff;
        font-size: 1.05em;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        letter-spacing: 0.02em;
        transition: background 0.15s, transform 0.1s;
    }
    #intro-overlay button:hover { background: #2c5282; transform: translateY(-1px); }

    /* ── Game view ── */
    #game-view { display: none; }
    #game-view.active { display: block; }

    #scene-title {
        font-size: 1.35em;
        font-weight: 700;
        color: #1a365d;
        padding-bottom: 10px;
        border-bottom: 2px solid #bee3f8;
        margin-bottom: 14px;
    }

    #break-timer {
        font-size: 0.88em;
        color: #718096;
        min-height: 18px;
        margin-bottom: 4px;
    }

    #scene-story {
        color: #4a5568;
        line-height: 1.75;
        font-size: 0.98em;
        margin-bottom: 16px;
    }

    /* ── Reference / results tables ── */
    #disease-chart { margin: 12px 0; }
    #disease-chart table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.88em;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    #disease-chart th {
        background: #2b6cb0;
        color: #fff;
        padding: 9px 14px;
        text-align: left;
        font-weight: 600;
    }
    #disease-chart td {
        padding: 8px 14px;
        border-bottom: 1px solid #e2e8f0;
        color: #2d3748;
    }
    #disease-chart tr:last-child td { border-bottom: none; }
    #disease-chart tr:nth-child(even) td { background: #f7fafc; }

    /* ── Choices ── */
    #choices {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 4px;
    }
    #choices button {
        padding: 10px 16px;
        border: 1.5px solid #bee3f8;
        border-radius: 7px;
        background: #fff;
        color: #2b6cb0;
        font-size: 0.93em;
        cursor: pointer;
        text-align: left;
        transition: background 0.12s, border-color 0.12s;
    }
    #choices button:hover { background: #ebf8ff; border-color: #90cdf4; }

    /* Keep legacy score element invisible */
    #score { display: none; }
    #telemedicine-count { display: none; }
    #final-score { display: none; }

    /* ── Sidebar ── */
    #progress-sidebar {
        width: 210px;
        flex-shrink: 0;
        background: #1a365d;
        color: #e2e8f0;
        padding: 20px 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    #progress-sidebar.hidden { display: none !important; }

    .sb-heading {
        font-size: 0.65em;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #90cdf4;
        margin-bottom: 3px;
    }
    .sb-val {
        font-size: 1.05em;
        font-weight: 700;
        color: #fff;
    }
    .sb-card {
        background: rgba(255,255,255,0.08);
        border-radius: 8px;
        padding: 10px 12px;
    }

    #job-graphic {
        margin-top: auto;
        text-align: center;
        padding: 16px 0 4px;
        border-top: 1px solid rgba(255,255,255,0.1);
    }
    #job-icon { font-size: 2.8em; display: block; line-height: 1.1; }
    #job-label {
        font-size: 0.68em;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #90cdf4;
        margin-top: 5px;
    }
</style>

<div id="app-layout">

    <main id="main-content">

        <div id="intro-overlay">
            <!-- populated by JS -->
        </div>

        <div id="game-view" class="game-view hidden">
            <h2 id="scene-title"></h2>
            <div id="break-timer"></div>
            <p id="telemedicine-count" class="hidden">Telemedicine Sessions: 0</p>
            <p id="final-score" class="hidden"></p>
            <p id="scene-story"></p>
            <div id="disease-chart"></div>
            <div id="choices"></div>
        </div>

        <div id="task-grid"></div>
    </main>

    <aside id="progress-sidebar" class="hidden">
        <div id="transferability-display" style="display:none"></div> 
        <div class="sb-card">
            <div class="sb-heading">Day</div>
            <div class="sb-val" id="day-display">Monday</div>
        </div>
      
        <div class="sb-card">
            <div class="sb-heading">Shift</div>
            <div class="sb-val" id="shift-display">1 of 3</div>
        </div>
        <div class="sb-card">
            <div class="sb-heading">Current Job</div>
            <div class="sb-val" id="current-job">Hospital</div>
        </div>
        <div class="sb-card">
            <div class="sb-heading">Total Reward</div>
            <div class="sb-val" id="total-reward">$0</div>
        </div>
        <!-- <div class="sb-card">
            <div class="sb-heading">Time of Day</div>
            <div class="sb-val" id="timer">9:00:00 AM</div>
        </div>
        <div class="sb-card">
            <div class="sb-heading">Continuous Work</div>
            <div class="sb-val" id="continuous-work-time">0:00</div>
        </div> -->
        <div class="sb-card">
            <div class="sb-heading">Accuracy</div>
            <div class="sb-val" id="accuracy">—</div>
        </div>
        <!-- legacy hidden -->
        <p id="score" style="display:none"></p>

        <div id="job-graphic">
            <span id="job-icon">🏥</span>
            <div id="job-label">Hospital</div>
        </div>
    </aside>

</div>

<div id="game-over" class="game-over hidden">
    <div>
        <h2>Day Complete!</h2>
        <p id="final-message">Thank you for playing.</p>
        <button id="restart-game-btn" class="hidden">Restart</button>
    </div>
</div>

<div id="slider-container" class="slideContainer hidden">
    <input value="0" type="range" min="0" max="100" id="myRange" class="slider">
    <p>Calculated Value: <span id="value">50</span></p>
</div>
